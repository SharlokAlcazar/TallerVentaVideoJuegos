<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/videojuegos}">Videojuegos</a>
            <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/ventas}">Ventas</a>
            <a class="nav-link" th:href="@{/carrito}">
                🛒 Carrito
                <span class="badge bg-danger" th:if="${totalCarritoItems > 0}" th:text="${totalCarritoItems}"></span>
            </a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Clientes</h1>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo</a>
    </div>
    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.telefono}"></td>
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar este cliente?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-outline-secondary">← Volver al panel</a>
</div>
</body>
</html>
