<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Ventas de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/videojuegos}">Videojuegos</a>
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/ventas}">Ventas</a>
            <a class="nav-link" th:href="@{/carrito}">
                🛒 Carrito
                <span class="badge bg-danger" th:if="${totalCarritoItems > 0}" th:text="${totalCarritoItems}"></span>
            </a>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mb-4">Panel principal</h1>
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Videojuegos</h5>
                    <p class="display-6" th:text="${totalVideojuegos}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Clientes</h5>
                    <p class="display-6" th:text="${totalClientes}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Ventas</h5>
                    <p class="display-6" th:text="${totalVentas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Ingresos</h5>
                    <p class="display-6" th:text="${'$' + totalIngresos}">$0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5 d-flex gap-2">
        <a th:href="@{/videojuegos/nuevo}" class="btn btn-primary">+ Nuevo videojuego</a>
        <a th:href="@{/clientes/nuevo}" class="btn btn-secondary">+ Nuevo cliente</a>
        <a th:href="@{/ventas/nueva}" class="btn btn-success">+ Registrar venta</a>
    </div>
</div>
</body>
</html>
