<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
    </div>
</nav>
<div class="container">
    <h1 th:text="${videojuego.id} != null ? 'Editar videojuego' : 'Nuevo videojuego'"></h1>
    <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post" class="bg-white p-4 shadow-sm rounded">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}" required
                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
            <div class="text-danger" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Plataforma</label>
            <select class="form-select" th:field="*{plataforma}" required
                    th:classappend="${#fields.hasErrors('plataforma')} ? 'is-invalid'">
                <option value="">Seleccione...</option>
                <option value="PS5">PlayStation 5</option>
                <option value="Xbox Series X">Xbox Series X</option>
                <option value="PC">PC</option>
                <option value="Switch">Nintendo Switch</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('plataforma')}" th:errors="*{plataforma}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Género</label>
            <input type="text" class="form-control" th:field="*{genero}" placeholder="Acción, RPG, Deportes...">
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{precio}" required
                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
            <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" min="0" class="form-control" th:field="*{stock}" required
                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
            <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">URL de la imagen (portada) — opcional</label>
            <input type="text" class="form-control" th:field="*{imagenUrl}"
                   placeholder="https://ejemplo.com/portada.jpg">
            <div class="form-text">Pega el enlace directo a una imagen. Si lo dejas vacío, se mostrará un ícono genérico.</div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/videojuegos}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
