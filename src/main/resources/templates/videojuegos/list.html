<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/videojuegos}">Videojuegos</a>
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/ventas}">Ventas</a>
            <a class="nav-link" th:href="@{/carrito}">
                🛒 Carrito
                <span class="badge bg-danger" th:if="${totalCarritoItems > 0}" th:text="${totalCarritoItems}"></span>
            </a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Videojuegos</h1>
        <a th:href="@{/videojuegos/nuevo}" class="btn btn-primary">+ Nuevo</a>
    </div>

    <form class="d-flex mb-3" method="get" th:action="@{/videojuegos}">
        <input type="text" name="buscar" class="form-control me-2"
               placeholder="Buscar por título, plataforma o género..." th:value="${buscar}">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
        <a th:if="${buscar}" th:href="@{/videojuegos}" class="btn btn-outline-secondary ms-2">Limpiar</a>
    </form>

    <div class="alert alert-warning" th:if="${buscar != null and #lists.isEmpty(videojuegos)}">
        No se encontraron videojuegos para "<span th:text="${buscar}"></span>".
    </div>

    <table class="table table-striped bg-white shadow-sm align-middle">
        <thead class="table-dark">
        <tr>
            <th>Imagen</th>
            <th>ID</th>
            <th>Título</th>
            <th>Plataforma</th>
            <th>Género</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${videojuegos}">
            <td>
                <img th:if="${v.imagenUrl != null and !v.imagenUrl.isEmpty()}"
                     th:src="${v.imagenUrl}" alt="Portada" style="width:50px;height:70px;object-fit:cover;" class="rounded">
                <span th:unless="${v.imagenUrl != null and !v.imagenUrl.isEmpty()}"
                      style="width:50px;height:70px;" class="d-inline-flex align-items-center justify-content-center bg-light rounded text-muted">🎮</span>
            </td>
            <td th:text="${v.id}"></td>
            <td th:text="${v.titulo}"></td>
            <td th:text="${v.plataforma}"></td>
            <td th:text="${v.genero}"></td>
            <td th:text="${'$' + v.precio}"></td>
            <td th:text="${v.stock}"></td>
            <td>
                <div class="d-flex flex-wrap gap-1 align-items-center">
                    <a th:href="@{/videojuegos/editar/{id}(id=${v.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/videojuegos/eliminar/{id}(id=${v.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Eliminar este videojuego?')">Eliminar</a>

                    <form th:if="${v.stock > 0}" th:action="@{/carrito/agregar}" method="post"
                          class="d-flex align-items-center gap-1">
                        <input type="hidden" name="videojuegoId" th:value="${v.id}">
                        <input type="number" name="cantidad" value="1" min="1" th:max="${v.stock}"
                               class="form-control form-control-sm" style="width:65px;">
                        <button type="submit" class="btn btn-sm btn-success">🛒 Agregar</button>
                    </form>
                    <span th:if="${v.stock == 0}" class="badge bg-secondary">Sin stock</span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-outline-secondary">← Volver al panel</a>
</div>
</body>
</html>
