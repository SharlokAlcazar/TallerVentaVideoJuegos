<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
    </div>
</nav>
<div class="container">
    <h1>Registrar venta</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/ventas/registrar}" th:object="${ventaForm}" method="post" class="bg-white p-4 shadow-sm rounded">

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{clienteId}"
                    th:classappend="${#fields.hasErrors('clienteId')} ? 'is-invalid'">
                <option value="">Seleccione...</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Videojuego</label>
            <select class="form-select" th:field="*{videojuegoId}"
                    th:classappend="${#fields.hasErrors('videojuegoId')} ? 'is-invalid'">
                <option value="">Seleccione...</option>
                <option th:each="v : ${videojuegos}" th:value="${v.id}"
                        th:text="${v.titulo + ' - $' + v.precio + ' (stock: ' + v.stock + ')'}"
                        th:disabled="${v.stock == 0}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('videojuegoId')}" th:errors="*{videojuegoId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" th:field="*{cantidad}" min="1"
                   th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'">
            <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
        </div>

        <button type="submit" class="btn btn-success">Registrar venta</button>
        <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
