<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/videojuegos}">Videojuegos</a>
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link active" th:href="@{/ventas}">Ventas</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Ventas</h1>
        <a th:href="@{/ventas/nueva}" class="btn btn-success">+ Registrar venta</a>
    </div>
    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.id}"></td>
            <td th:text="${v.cliente.nombre}"></td>
            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${'$' + v.total}"></td>
            <td>
                <a th:href="@{/ventas/detalle/{id}(id=${v.id})}" class="btn btn-sm btn-info">Ver</a>
                <a th:href="@{/ventas/eliminar/{id}(id=${v.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar esta venta?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-outline-secondary">← Volver al panel</a>
</div>
</body>
</html>
