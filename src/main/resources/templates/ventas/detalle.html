<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
    </div>
</nav>
<div class="container">
    <h1>Detalle de venta #<span th:text="${venta.id}"></span></h1>
    <p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombre}"></span></p>
    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>

    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Videojuego</th>
            <th>Cantidad</th>
            <th>Precio unitario</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${venta.detalles}">
            <td th:text="${d.videojuego.titulo}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="${'$' + d.precioUnitario}"></td>
            <td th:text="${'$' + d.subtotal}"></td>
        </tr>
        </tbody>
    </table>

    <h4>Total: <span th:text="${'$' + venta.total}"></span></h4>

    <a th:href="@{/ventas}" class="btn btn-outline-secondary">← Volver a ventas</a>
</div>
</body>
</html>
