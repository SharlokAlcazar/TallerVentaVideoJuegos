<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finalizar compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
    </div>
</nav>
<div class="container">
    <h1 class="mb-4">Finalizar compra</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>Videojuego</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${carrito.items}">
            <td th:text="${item.titulo}"></td>
            <td th:text="${item.cantidad}"></td>
            <td th:text="${'$' + item.subtotal}"></td>
        </tr>
        </tbody>
    </table>
    <h4>Total: <span th:text="${'$' + carrito.total}"></span></h4>

    <form th:action="@{/carrito/finalizar}" method="post" class="bg-white p-4 shadow-sm rounded mt-3">
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" name="clienteId" required>
                <option value="">Seleccione...</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Confirmar venta</button>
        <a th:href="@{/carrito}" class="btn btn-outline-secondary">Volver al carrito</a>
    </form>
</div>
</body>
</html>
