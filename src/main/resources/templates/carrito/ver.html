<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎮 Ventas Videojuegos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/videojuegos}">Videojuegos</a>
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/ventas}">Ventas</a>
            <a class="nav-link active" th:href="@{/carrito}">
                🛒 Carrito
                <span class="badge bg-danger" th:if="${totalCarritoItems > 0}" th:text="${totalCarritoItems}"></span>
            </a>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mb-4">Tu carrito</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div th:if="${carrito.estaVacio()}" class="alert alert-info">
        El carrito está vacío. <a th:href="@{/videojuegos}">Ver videojuegos disponibles</a>
    </div>

    <div th:unless="${carrito.estaVacio()}">
        <table class="table table-striped bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Videojuego</th>
                <th>Cantidad</th>
                <th>Precio unitario</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${carrito.items}">
                <td th:text="${item.titulo}"></td>
                <td th:text="${item.cantidad}"></td>
                <td th:text="${'$' + item.precioUnitario}"></td>
                <td th:text="${'$' + item.subtotal}"></td>
                <td>
                    <a th:href="@{/carrito/eliminar/{id}(id=${item.videojuegoId})}" class="btn btn-sm btn-danger">Quitar</a>
                </td>
            </tr>
            </tbody>
        </table>

        <h4>Total: <span th:text="${'$' + carrito.total}"></span></h4>

        <div class="d-flex gap-2">
            <a th:href="@{/carrito/finalizar}" class="btn btn-success">Finalizar compra</a>
            <a th:href="@{/carrito/vaciar}" class="btn btn-outline-danger"
               onclick="return confirm('¿Vaciar el carrito?')">Vaciar carrito</a>
            <a th:href="@{/videojuegos}" class="btn btn-outline-secondary">Seguir comprando</a>
        </div>
    </div>
</div>
</body>
</html>
