spring.application.name=ventas-videojuegos

# Perfil activo: "dev" (H2 local, por defecto) o "prod" (Neon/PostgreSQL).
# Se puede sobreescribir con la variable de entorno SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}

# JPA / Hibernate (común a ambos entornos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.thymeleaf.cache=false
